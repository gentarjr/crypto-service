# ═══════════════════════════════════════════════════════════
#  PRODUCTION PROFILE — VPS Singapore
#  Aktif saat: --spring.profiles.active=prod
#  Override application.yaml untuk production settings
# ═══════════════════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:h2:file:/opt/cryptobot/data/tradedb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  application:
    name: crypto
  # Matikan H2 console di production (tidak perlu & security risk)
  h2:
    console:
      enabled: false
  web:
    resources:
      static-locations: file:/opt/cryptobot/static/, classpath:/static/

# ═══════════════════════════════════════════════════════════
#  BINANCE CONFIG
# ═══════════════════════════════════════════════════════════
exchange:
  binance:
    api-key: ${BINANCE_API_KEY}
    secret-key: ${BINANCE_SECRET_KEY}
    testnet: ${BINANCE_TESTNET:true}
    base-url-api: https://api.binance.com/api
    websoceket-url: wss://stream.binance.com
    testnet-web: https://api.binance.com

# ═══════════════════════════════════════════════════════════
#  TRADING CONFIG
# ═══════════════════════════════════════════════════════════
trading:
  paper:
    enabled: false
  enabled: true
  pair:
    base: BNB
    quote: USDT
  oco:
    enabled: true

  market-data:
    primary-interval: m15    # ✅ 15 menit (bukan m5)
    cache-size: 200
    fetch-interval-seconds: 60

  indicators:
    ema-fast-period: 9
    ema-slow-period: 21
    rsi-period: 14
    rsi-overbought: 70
    rsi-oversold: 30
    volume-ma-period: 20
    volume-surge-multiplier: 1.5
    volume-extreme-multiplier: 2.5
    volume-low-threshold: 0.5
    atr-period: 14
    atr-sl-multiplier: 1.5
    atr-tp-multiplier: 2.0
    atr-bb-sl-multiplier: 0.5
    bb-period: 20
    bb-std-dev: 2.0
    bb-squeeze-threshold: 1.5
    adx-period: 14
    adx-ranging-threshold: 20
    adx-trending-threshold: 25
    adx-strong-trend-threshold: 40

  strategy:
    ema:
      enabled: true
      volume-surge-multiplier: 1.5
      rsi-max-threshold: 70
      price-extension-max: 1.015
      atr-extreme-multiplier: 2.5
      buy-score-threshold: 65
      strong-buy-score-threshold: 85
      pullback-enabled: true
      pullback-tolerance-percent: 0.3  # max 0.3% dari EMA9
      pullback-max-candles: 3
    bb:
      buy-score-threshold: 60
      strong-buy-score-threshold: 80
      enabled: true
      rsi-oversold-threshold: 30
      volume-min-multiplier: 0.5
      percent-b-min: -0.1
      sl-atr-multiplier: 1.0
      tp-atr-multiplier: 1.5

  risk:
    timeout-hours: 4              # default timeout
    timeout-profit-threshold: 0.5
    modal: 300                  # fallback kalau tidak bisa fetch balance
    sl-atr-multiplier: 2.0
    tp-atr-multiplier: 3.5
    max-position-percent: 75.0  # max 90% balance per posisi
    trailing-atr-multiplier: 1.5
    risk-per-trade-percent: 0.5   # dari 1.0
    max-daily-loss-percent: 5.0   # dari 3.0
    max-consecutive-losses: 10     # dari 3
    cooldown-minutes: 60          # dari 30
    bb-cooldown-minutes: 30
    max-slippage-percent: 0.8     # dari 0.3
    partial-tp-enabled: true
    partial-tp-ratio: 0.5

  sentiment:
    enabled: true
    lunarcrush-api-key: ${LUNARCRUSH_API_KEY}   # ← dari .env
    topic: bnb                                    # ← topik BNB
    score-weight: 15
    cache-minutes: 60                    # ← update tiap jam
    lunarcrush-enabled: false  # ← disable hanya LunarCrush

  websocket:
    base-url: wss://stream.binance.com/ws  # ✅ aktif di VPS
    reconnect-delay-seconds: 5
    max-reconnect-attempts: 10
    enabled: true               # ✅ aktifkan WebSocket di VPS!
    health:
      enabled: true
      idle-threshold-seconds: 90

  hours:
    enabled: false              # ✅ crypto 24/7, tidak perlu jam aktif

  mta:
    enabled: true
    ema-period: 50
    cache-duration-minutes: 30

  live:
    enabled: true               # ✅ live trading aktif (testnet)

  health-check:
    cache-duration-seconds: 30
    min-quote-balance: 10
    max-clock-skew-ms: 1000

# ═══════════════════════════════════════════════════════════
#  TELEGRAM CONFIG
# ═══════════════════════════════════════════════════════════
telegram:
  enabled: true
  bot-token: ${TELEGRAM_BOT_TOKEN}
  chat-id: ${TELEGRAM_CHAT_ID}
  parse-mode: HTML
  api-url: https://api.telegram.org

# ═══════════════════════════════════════════════════════════
#  BALANCE
# ═══════════════════════════════════════════════════════════
balance:
  symbol: BTC|BNB|USDT|SOL|ETH

# ═══════════════════════════════════════════════════════════
#  LOGGING — production level, simpan ke file
# ═══════════════════════════════════════════════════════════
logging:
  level:
    # Bot sendiri: INFO (tidak terlalu verbose)
    com.bot.testnet.crypto: INFO
    # Library external: WARN (kurangi noise)
    org.knowm.xchange: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.java_websocket: WARN
  file:
    name: /opt/cryptobot/logs/crypto-bot.log  # ✅ path di VPS
  logback:
    rollingpolicy:
      max-file-size: 10MB   # rotate setiap 10MB
      max-history: 30       # simpan 30 hari
      total-size-cap: 500MB # total max 500MB